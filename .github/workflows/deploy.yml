name: Deploy Frontend to Vercel

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Production Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build

      - name: Deploy to Vercel (CLI)
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN secret is not set in GitHub repository settings."
            echo "Production build verified successfully! Skipping Vercel deploy step."
          else
            npx vercel --token "${{ secrets.VERCEL_TOKEN }}" --prod --yes
          fi
