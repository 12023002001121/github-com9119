[package]
name = "paystream-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "20.3.2"
ethnum = "1.5.3"

[dev-dependencies]
soroban-sdk = { version = "20.3.2", features = ["testutils"] }
paystream-reputation = { path = "../reputation", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
